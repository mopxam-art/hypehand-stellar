[workspace]
resolver = "2"
members = [
    "contracts/gifting",
]

[workspace.dependencies]
soroban-sdk = { version = "21.7.7", default-features = false }
ed25519-dalek = "=2.1.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
