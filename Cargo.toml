[workspace]
resolver = "2"
members = [
    "contracts/gifting",
    "crates/cli",
    "crates/utils",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HypeHand Contributors <dev@hypehand.io>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Xaxxoo/hypehand-stellar"
homepage = "https://github.com/Xaxxoo/hypehand-stellar"
documentation = "https://docs.rs/hypehand"
keywords = ["stellar", "soroban", "blockchain", "payments", "smart-contracts"]
categories = ["cryptography::cryptocurrencies", "network-programming", "command-line-utilities"]

[workspace.dependencies]
soroban-sdk = "21.7.7"
ed25519-dalek = "=2.1.1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
