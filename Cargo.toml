[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/config",
    "crates/events",
    "crates/keys",
    "crates/metrics",
    "crates/telemetry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["HypeHand Contributors <dev@hypehand.io>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/Xaxxoo/hypehand-stellar"
homepage = "https://github.com/Xaxxoo/hypehand-stellar"
documentation = "https://docs.rs/hypehand"
keywords = ["stellar", "soroban", "blockchain", "payments", "smart-contracts"]
categories = ["cryptography::cryptocurrencies", "network-programming", "command-line-utilities"]

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "warn"
doc_markdown = "allow"
module_name_repetitions = "allow"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.14"
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
zeroize = { version = "1.9", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
thiserror = "1.0"
base64 = "0.22"
stellar-strkey = "1.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }
tempfile = "3.17"
