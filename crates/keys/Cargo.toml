[package]
name = "hypehand-keys"
version = "0.1.0"
edition = "2021"
description = "Secure secret management and encrypted keystore for Stellar keys"

[dependencies]
zeroize = { version = "1.9", features = ["derive"] }
secrecy = { version = "0.10", features = ["serde"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
base64 = "0.22"
stellar-strkey = "1.0"
ed25519-dalek = { version = "2.1", default-features = false, features = ["fast"] }

[dev-dependencies]
tempfile = "3.17"
