[package]
name = "hypehand-db"
version = "0.1.0"
edition = "2021"
description = "Off-chain database layer and repository for HypeHand user metadata and gift history"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
